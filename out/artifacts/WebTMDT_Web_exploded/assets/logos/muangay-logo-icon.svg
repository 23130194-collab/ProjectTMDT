<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Nền Xanh Hoàng Gia Tươi Sáng & Nổi Bật -->
    <linearGradient id="mn-bg-vibrant" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Điểm nhấn Cam Năng Động cho lõi Mua Ngay -->
    <linearGradient id="mn-accent-orange" x1="16" y1="20" x2="32" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <filter id="mn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Nền khối bo góc rực rỡ -->
  <rect width="48" height="48" rx="12" fill="url(#mn-bg-vibrant)" />

  <g filter="url(#mn-glow)">
    <!-- Quai túi uốn cong phóng to, nét dày rõ ràng -->
    <path d="M17 15V10.5C17 6.634 20.134 3.5 24 3.5C27.866 3.5 31 6.634 31 10.5V15" 
          stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

    <!-- Thân túi mua sắm / kiện hàng Re-Commerce mở rộng chiếm trọn không gian -->
    <path d="M7.5 15H40.5L37.8 41.2C37.7 42.2 36.8 43 35.8 43H12.2C11.2 43 10.3 42.2 10.2 41.2L7.5 15Z" 
          fill="#FFFFFF" fill-opacity="0.18" 
          stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />

    <!-- Lõi chữ M & N cách điệu: Nét to rõ ràng, phối màu Vàng Cam cực kỳ nổi bật -->
    <path d="M15 36V23L24 30.5L33 23V36" 
          stroke="url(#mn-accent-orange)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Điểm chấm bảo chứng trao đổi -->
    <circle cx="24" cy="20.5" r="2.2" fill="#FFFFFF" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 48" width="290" height="48" fill="none">
  <defs>
    <linearGradient id="full-bg-vibrant" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="full-accent-orange" x1="16" y1="20" x2="32" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <filter id="full-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Biểu tượng Icon Phóng To -->
  <g transform="translate(0, 0)">
    <rect width="48" height="48" rx="12" fill="url(#full-bg-vibrant)" />
    <g filter="url(#full-glow)">
      <!-- Quai túi -->
      <path d="M17 15V10.5C17 6.634 20.134 3.5 24 3.5C27.866 3.5 31 6.634 31 10.5V15" 
            stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
      <!-- Thân túi -->
      <path d="M7.5 15H40.5L37.8 41.2C37.7 42.2 36.8 43 35.8 43H12.2C11.2 43 10.3 42.2 10.2 41.2L7.5 15Z" 
            fill="#FFFFFF" fill-opacity="0.18" 
            stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
      <!-- Lõi M & N Vàng Cam -->
      <path d="M15 36V23L24 30.5L33 23V36" 
            stroke="url(#full-accent-orange)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Điểm bảo chứng -->
      <circle cx="24" cy="20.5" r="2.2" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Tên Thương Hiệu MuaNgay: Tương phản cao, sắc sảo -->
  <text x="60" y="27" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="23" font-weight="900" fill="#0F172A" letter-spacing="-0.5">
    Mua<tspan fill="#2563EB">Ngay</tspan>
  </text>

  <!-- Khẩu Hiệu Slogan Rõ Ràng -->
  <text x="60" y="42" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#475569" letter-spacing="-0.2">
    Cần là Mua Ngay, thừa thì Pass Luôn
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Nền Cam Năng Động Kích Thích Mua Sắm (Energetic Orange) -->
    <linearGradient id="v3-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="v3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#7C2D12" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="48" height="48" rx="12" fill="url(#v3-bg)" />

  <g filter="url(#v3-shadow)">
    <!-- Quai túi trắng dày dặn -->
    <path d="M17 15V10.5C17 6.634 20.134 3.5 24 3.5C27.866 3.5 31 6.634 31 10.5V15" 
          stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" />

    <!-- Thân túi trắng tinh -->
    <path d="M7.5 15H40.5L37.8 41.2C37.7 42.2 36.8 43 35.8 43H12.2C11.2 43 10.3 42.2 10.2 41.2L7.5 15Z" 
          fill="#FFFFFF" fill-opacity="0.22" 
          stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" />

    <!-- Lõi chữ M & N Trắng Tuyết nổi rực rỡ trên nền cam -->
    <path d="M15 36V23L24 30.5L33 23V36" 
          stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="24" cy="20.5" r="2.2" fill="#FEF08A" />
  </g>
</svg>

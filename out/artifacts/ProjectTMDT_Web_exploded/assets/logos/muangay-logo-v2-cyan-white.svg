<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Nền Xanh Tươi Sáng Năng Động (Vibrant Azure) -->
    <linearGradient id="v2-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <filter id="v2-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="48" height="48" rx="12" fill="url(#v2-bg)" />

  <g filter="url(#v2-shadow)">
    <!-- Quai túi trắng dày dặn -->
    <path d="M17 15V10.5C17 6.634 20.134 3.5 24 3.5C27.866 3.5 31 6.634 31 10.5V15" 
          stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" />

    <!-- Thân túi trắng tinh khiết -->
    <path d="M7.5 15H40.5L37.8 41.2C37.7 42.2 36.8 43 35.8 43H12.2C11.2 43 10.3 42.2 10.2 41.2L7.5 15Z" 
          fill="#FFFFFF" fill-opacity="0.2" 
          stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" />

    <!-- Lõi chữ M & N Trắng Tuyết 100% cực kỳ sắc nét -->
    <path d="M15 36V23L24 30.5L33 23V36" 
          stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="24" cy="20.5" r="2.2" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.2" />
  </g>
</svg>
